# Required GitHub secrets:
#   REACT_APP_FIREBASE_API_KEY
#   REACT_APP_FIREBASE_AUTH_DOMAIN
#   REACT_APP_FIREBASE_PROJECT_ID
#   REACT_APP_FIREBASE_STORAGE_BUCKET
#   REACT_APP_FIREBASE_MESSAGING_SENDER_ID
#   REACT_APP_FIREBASE_APP_ID
#   REACT_APP_FIREBASE_MEASUREMENT_ID
#   FIREBASE_SERVICE_ACCOUNT   (base64-encoded service account JSON for backend tests)
#   CYPRESS_API_URL            (Railway backend URL, e.g. https://prepify.up.railway.app)

name: Tests

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test

  e2e:
    name: E2e (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm install
      - name: Install server dependencies
        run: npm install
        working-directory: server
      - name: Start Express server
        run: node index.js &
        working-directory: server
        env:
          PORT: 4000
          MONGO_URI: ${{ secrets.MONGO_URI }}
          FRONTEND_URLS: http://localhost:3000
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Start React dev server
        run: npm start &
        env:
          BROWSER: none
          REACT_APP_API_URL: http://localhost:4000
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
      - name: Install wait-on
        run: npm install -g wait-on
      - name: Wait for servers
        run: npx wait-on http://localhost:3000 http://localhost:4000 --timeout 120000
      - name: Run Cypress
        run: npx cypress run --headless
        env:
          CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
