# Required GitHub secrets:
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID
#   FIREBASE_SERVICE_ACCOUNT   (base64-encoded service account JSON for backend tests)
#   CYPRESS_API_URL            (Railway backend URL, e.g. https://prepify.up.railway.app)
# The E2E Express server runs against an ephemeral Mongo service container (see the
# e2e job), so no MONGO_URI secret is needed — the Cypress specs mock the API anyway.

name: Tests

on:
  pull_request:
  push:
    branches: [main, development, release]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install platform-specific rolldown binding
        run: npm install @rolldown/binding-linux-x64-gnu --no-save
      - run: npm test

  static:
    name: Static (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      # vite build needs the platform-specific rolldown binding (see frontend job).
      - name: Install platform-specific rolldown binding
        run: npm install @rolldown/binding-linux-x64-gnu --no-save
      # Typecheck first — it's fast and fails clearly before the heavier build.
      # `tsc --noEmit` enforces the tsconfig `strict` setting, which `vite build`
      # (per-file esbuild/rolldown transpile) does NOT check.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      # The Vitest suite lives in src/test/**, which the base tsconfig excludes
      # (the Cypress config files would otherwise poison the program with
      # Cypress's global Chai `expect`). tsconfig.tests.json re-includes it so
      # test files can't silently drift from the real types.
      - name: Typecheck tests (tsc --noEmit -p tsconfig.tests.json)
        run: npx tsc --noEmit -p tsconfig.tests.json
      # Verify the production bundle actually builds (Netlify parity).
      - name: Production build (vite build)
        run: npm run build

  e2e:
    name: E2e (Cypress)
    runs-on: ubuntu-latest
    # The Cypress specs fully intercept the API with fixtures (cy.intercept), so
    # the Express server only needs to boot and serve /health for the wait-on
    # gate — it never reads real data. Run it against an ephemeral, throwaway
    # Mongo so E2E doesn't depend on (and never touches) the prod database or a
    # rotating MONGO_URI secret. GitHub waits for the healthcheck before steps run.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install platform-specific rolldown binding
        run: npm install @rolldown/binding-linux-x64-gnu --no-save
      - name: Install server dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: server
      - name: Start Express server
        run: |
          node index.js > server.log 2>&1 &
          echo $! > server.pid
          sleep 3
        working-directory: server
        env:
          PORT: 4000
          MONGO_URI: mongodb://localhost:27017/prepify
          FRONTEND_URLS: http://localhost:3000
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Check Express server startup
        run: |
          if ! kill -0 $(cat server/server.pid) 2>/dev/null; then
            echo "Express server failed to start"
            cat server/server.log
            exit 1
          fi
      - name: Start React dev server
        run: npm start > react.log 2>&1 &
        env:
          BROWSER: none
          VITE_API_URL: http://localhost:4000
          VITE_CYPRESS: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Wait for servers
        run: npx wait-on http://127.0.0.1:3000 http://127.0.0.1:4000/health --timeout 120000
      - name: Check server status
        if: failure()
        run: |
          echo "=== Express Server Log ==="
          cat server/server.log || echo "No server log found"
          echo "=== React Dev Server Log ==="
          cat react.log || echo "No react log found"
          echo "=== Network Status ==="
          netstat -tlnp || ss -tlnp || echo "netstat/ss not available"
      - name: Run Cypress
        run: npx cypress run --headless
        env:
          CYPRESS_API_URL: http://localhost:4000
          CYPRESS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

  fallow:
    name: Fallow (dead-code, advisory)
    runs-on: ubuntu-latest
    # Option B: advisory only — this job NEVER blocks merges (continue-on-error).
    # Findings are posted to the run's Step Summary for visibility.
    # TODO: once we trust the signal, flip to Option A (baseline-gated regression
    # mode): commit a baseline of existing findings, fail only on NEW dead code,
    # and drop `continue-on-error`. See the `regression` config in fallow docs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `fallow audit` can diff changed files against the base.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # node_modules must be present so Fallow can resolve imports/deps;
      # without them it reports false "unresolved import" / "unused dependency" noise.
      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install server dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: server
      # Version pinned for deterministic CI — Fallow releases very frequently and
      # a new version could change findings and surprise a green PR.
      - name: Run Fallow dead-code analysis
        run: |
          {
            echo '## Fallow — dead-code (advisory, non-blocking)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npx --yes fallow@2.95.0 dead-code | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Changed-files audit: dead-code + complexity + duplication scoped to the
      # PR diff. Default `--gate new-only` only counts findings the PR introduces
      # (inherited backlog is reported but not failed). PR events only — needs a base.
      - name: Run Fallow audit (changed files)
        if: github.event_name == 'pull_request'
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
        run: |
          {
            echo "## Fallow — audit: changed files vs ${{ github.base_ref }} (advisory)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npx --yes fallow@2.95.0 audit | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
